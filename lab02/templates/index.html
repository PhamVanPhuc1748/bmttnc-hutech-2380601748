<!DOCTYPE html>
<html lang="en">
<head>
    <title>NERV Cypher Center - Hệ thống Bảo mật Thông tin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Bảng màu NERV/Evangelion */
            --bg-black: #050505;
            --panel-dark: #121212;
            --eva-purple: #6f2282;
            --eva-green: #32cd32;
            --eva-red: #c3073f;
            --nerv-orange: #ff8c00;
            --text-main: #e0e0e0;
            --text-highlight: #00f2fe;
        }

        body { 
            /* Hình nền lục giác mờ (MAGI/Radar style) trên nền đen */
            background-color: var(--bg-black);
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)),
                url('https://www.transparenttextures.com/patterns/hexellence.png');
            background-attachment: fixed;
            font-family: 'Chakra Petch', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* Bảng điều khiển giao diện công nghiệp NERV */
        .nerv-interface-panel { 
            background: var(--panel-dark); 
            border-radius: 5px; /* Góc cạnh hơn, ít bo tròn */
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.15); /* Ánh cam nhẹ */
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }

        /* Dải màu cảnh báo NERV ở cạnh trên và dưới */
        .nerv-interface-panel::before,
        .nerv-interface-panel::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 10px;
            background: repeating-linear-gradient(
                45deg,
                var(--nerv-orange),
                var(--nerv-orange) 10px,
                #000 10px,
                #000 20px
            );
        }
        .nerv-interface-panel::before { top: 0; }
        .nerv-interface-panel::after { bottom: 0; }

        .title-main {
            font-weight: 700; 
            color: var(--nerv-orange);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.7);
            margin-top: 15px;
        }

        /* Nút bấm góc cạnh, Gradient, hiệu ứng phát sáng mạnh */
        .btn-eva { 
            font-weight: 700; 
            width: 90%; 
            margin: 15px auto; 
            display: block;
            border-radius: 3px; /* Phẳng và góc cạnh */
            padding: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid transparent;
            color: white;
            transition: all 0.3s ease-in-out;
            position: relative;
        }

        /* 1. Caesar (EVA-01: Tím & Xanh Neon) */
        .btn-caesar { 
            background: linear-gradient(135deg, var(--eva-purple) 0%, #4a148c 100%);
            border-color: var(--eva-green);
            box-shadow: 0 0 10px rgba(50, 205, 50, 0.5);
        }
        /* 2. Playfair (EVA-02: Đỏ & Cam) */
        .btn-playfair { 
            background: linear-gradient(135deg, #b71c1c 0%, var(--eva-red) 100%);
            border-color: var(--nerv-orange);
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }
        /* 3. Railfence (EVA-00: Cam & Vàng) */
        .btn-railfence { 
            background: linear-gradient(135deg, var(--nerv-orange) 0%, #f57c00 100%);
            border-color: #ffeb3b;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
            color: #000; /* Chữ tối trên nền sáng */
        }
        /* 4. Vigenere (Berzerk/High Alert: Đỏ rực) */
        .btn-vigenere { 
            background: linear-gradient(135deg, #d32f2f 0%, #ff1744 100%);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.8);
        }

        .btn-eva:hover {
            transform: scale(1.03) translateY(-2px);
            color: white;
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .btn-railfence:hover { color: #000; }

        /* Khối thông tin sinh viên kiểu màn hình Monitor readout */
        .student-info-readout {
            background: #0a0a0a;
            border: 1px solid #333;
            border-left: 5px solid var(--eva-green); /* Điểm nhấn xanh EVA-01 */
            border-radius: 3px;
            padding: 15px;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.1);
            text-align: left;
            margin-bottom: 25px;
        }

        .status-label {
            color: #555;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="nerv-interface-panel">
                    <img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20RGB-02.png" 
                         alt="HUTECH NERV System" style="width: 35%; margin: 15px auto 25px; filter: grayscale(1) brightness(1.5);">
                    
                    <h3 class="title-main mb-4">Hệ thống Mã hóa </h3>
                    
                    <div class="student-info-readout">
                        <div class="status-label">Personnel ID / Operator</div>
                        <h5 class="mb-2" style="color: white; font-weight: 700;">Phạm Văn Phúc</h5>
                        <div class="status-label mt-2">ID </div>
                        <h6 class="mb-0" style="color: var(--text-highlight);">2380601748</h6>
                    </div>

                    <p class="text-secondary mb-4" style="letter-spacing: 1px;">Vui lòng lựa chọn phó bản mật mã để tiến hành xử lý:</p>

                    <div class="mt-2 row">
                        <div class="col-6"><a href="/caesar" class="btn btn-eva btn-caesar">01. Caesar</a></div>
                        <div class="col-6"><a href="/playfair" class="btn btn-eva btn-playfair">02.  Playfair</a></div>
                        <div class="col-6"><a href="/railfence" class="btn btn-eva btn-railfence">03. Railfence</a></div>
                        <div class="col-6"><a href="/vigenere" class="btn btn-eva btn-vigenere">04. Vigenere</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div> 
</body>
</html>
