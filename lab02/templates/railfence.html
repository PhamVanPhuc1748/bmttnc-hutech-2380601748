<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rail Fence Protocol | Gundam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='gundam.css') }}">
    <script defer src="{{ url_for('static', filename='gundam.js') }}"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
    <div class="scan-line"></div>

    <div class="w-full max-w-3xl gundam-shell p-1">
        <div class="gundam-bar text-black px-4 py-2 flex justify-between items-center mb-6">
            <span class="font-bold tracking-[0.3em]">PROTOCOL: RAIL FENCE</span>
            <span class="text-xs">[ MIN RAIL 2 ]</span>
        </div>

        <div class="p-6 md:p-10">
            <div class="flex w-full max-w-md mx-auto mb-10 gap-4">
                <button type="button" id="btn-enc" onclick="gundamSwitchMode('enc')" class="px-4 py-3 border border-[#6eb6ff] bg-[#091224] text-[#6eb6ff] shadow-[0_0_15px_rgba(110,182,255,0.2)] font-bold tracking-[0.15em] text-xs md:text-sm transition-all w-1/2 text-center">ENCRYPT</button>
                <button type="button" id="btn-dec" onclick="gundamSwitchMode('dec')" class="px-4 py-3 border border-slate-700 bg-[#03060d] text-slate-500 font-bold tracking-[0.15em] text-xs md:text-sm transition-all hover:text-white w-1/2 text-center">DECRYPT</button>
            </div>

            <section id="sec-enc" class="block animate-fade-in">
                <form method="POST" action="/encrypt_railfence" class="space-y-6" onsubmit="return gundamAnimateSubmit(this)">
                    <div class="border border-slate-700 bg-[#03060d] p-4 flex flex-col md:flex-row md:items-center gap-2 md:gap-4 focus-within:border-[#6eb6ff] focus-within:shadow-[0_0_15px_rgba(110,182,255,0.15)] transition-all relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#6eb6ff] opacity-50 group-focus-within:opacity-100"></div>
                        <span class="text-[#6eb6ff] text-xs font-bold tracking-[0.2em] whitespace-nowrap pl-3 w-32">[ TX_DATA ] ></span>
                        <input type="text" name="inputPlainText" minlength="1" maxlength="256" class="bg-transparent outline-none w-full text-white text-sm tracking-widest font-mono" placeholder="TYPE_TRANSMISSION..." required autofocus autocomplete="off" />
                    </div>

                    <div class="border border-slate-700 bg-[#03060d] p-4 flex flex-col md:flex-row md:items-center gap-2 md:gap-4 focus-within:border-[#f8d44a] focus-within:shadow-[0_0_15px_rgba(248,212,74,0.15)] transition-all relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#f8d44a] opacity-50 group-focus-within:opacity-100"></div>
                        <span class="text-[#f8d44a] text-xs font-bold tracking-[0.2em] whitespace-nowrap pl-3 w-32">[ R_DEPTH ] ></span>
                        <input type="number" name="inputKeyPlain" min="2" max="20" step="1" inputmode="numeric" oninput="gundamNormalizeNumber(this, 2, 20)" class="bg-transparent outline-none w-full text-white text-sm tracking-widest font-mono" placeholder="2-20" required autocomplete="off" />
                    </div>

                    <button type="submit" class="cyber-btn w-full h-[54px] text-sm font-bold tracking-[0.25em] flex justify-between items-center px-6 mt-4">
                        <span>LAUNCH_ENCRYPTION</span><span class="text-[#6eb6ff] animate-pulse">>></span>
                    </button>
                </form>
            </section>

            <section id="sec-dec" class="hidden animate-fade-in">
                <form method="POST" action="/decrypt_railfence" class="space-y-6" onsubmit="return gundamAnimateSubmit(this)">
                    <div class="border border-slate-700 bg-[#03060d] p-4 flex flex-col md:flex-row md:items-center gap-2 md:gap-4 focus-within:border-[#ff5a67] focus-within:shadow-[0_0_15px_rgba(255,90,103,0.15)] transition-all relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#ff5a67] opacity-50 group-focus-within:opacity-100"></div>
                        <span class="text-[#ff5a67] text-xs font-bold tracking-[0.2em] whitespace-nowrap pl-3 w-32">[ RX_CIPHER ] ></span>
                        <input type="text" name="inputCipherText" minlength="1" maxlength="256" class="bg-transparent outline-none w-full text-white text-sm tracking-widest font-mono" placeholder="TYPE_CIPHER_DATA..." required autocomplete="off" />
                    </div>

                    <div class="border border-slate-700 bg-[#03060d] p-4 flex flex-col md:flex-row md:items-center gap-2 md:gap-4 focus-within:border-[#f8d44a] focus-within:shadow-[0_0_15px_rgba(248,212,74,0.15)] transition-all relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#f8d44a] opacity-50 group-focus-within:opacity-100"></div>
                        <span class="text-[#f8d44a] text-xs font-bold tracking-[0.2em] whitespace-nowrap pl-3 w-32">[ R_DEPTH ] ></span>
                        <input type="number" name="inputKeyCipher" min="2" max="20" step="1" inputmode="numeric" oninput="gundamNormalizeNumber(this, 2, 20)" class="bg-transparent outline-none w-full text-white text-sm tracking-widest font-mono" placeholder="2-20" required autocomplete="off" />
                    </div>

                    <button type="submit" class="cyber-btn w-full h-[54px] text-sm font-bold tracking-[0.25em] flex justify-between items-center px-6 mt-4" data-variant="danger">
                        <span>REVERSE_PROTOCOL</span><span class="text-[#ff5a67] animate-pulse">>></span>
                    </button>
                </form>
            </section>
        </div>

        <div class="px-6 py-4 flex justify-between text-xs text-slate-500 border-t border-slate-800">
            <a href="/" class="hover:text-white cursor-pointer">&lt; RETURN_TO_ROOT</a>
            <span>STATUS: ONLINE</span>
        </div>
    </div>

    <script>
        function gundamSwitchMode(mode) {
            const encSec = document.getElementById('sec-enc');
            const decSec = document.getElementById('sec-dec');
            const btnEnc = document.getElementById('btn-enc');
            const btnDec = document.getElementById('btn-dec');

            const classActiveEnc = "px-4 py-3 border border-[#6eb6ff] bg-[#091224] text-[#6eb6ff] shadow-[0_0_15px_rgba(110,182,255,0.2)] font-bold tracking-[0.15em] text-xs md:text-sm transition-all w-1/2 text-center";
            const classInactiveEnc = "px-4 py-3 border border-slate-700 bg-[#03060d] text-slate-500 font-bold tracking-[0.15em] text-xs md:text-sm transition-all hover:text-white w-1/2 text-center";
            
            const classActiveDec = "px-4 py-3 border border-[#ff5a67] bg-[#1a0b0d] text-[#ff5a67] shadow-[0_0_15px_rgba(255,90,103,0.2)] font-bold tracking-[0.15em] text-xs md:text-sm transition-all w-1/2 text-center";
            const classInactiveDec = "px-4 py-3 border border-slate-700 bg-[#03060d] text-slate-500 font-bold tracking-[0.15em] text-xs md:text-sm transition-all hover:text-white w-1/2 text-center";

            if(mode === 'enc') {
                encSec.classList.remove('hidden'); decSec.classList.add('hidden');
                btnEnc.className = classActiveEnc; btnDec.className = classInactiveDec;
            } else {
                encSec.classList.add('hidden'); decSec.classList.remove('hidden');
                btnEnc.className = classInactiveEnc; btnDec.className = classActiveDec;
            }
        }
    </script>
</body>
</html>
