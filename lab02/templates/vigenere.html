<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vigenere Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <table class="table">
            <tr><td style="text-align: center; font-weight: bold; font-size: 25px;">VIGENERE CIPHER</td></tr>
            
            <tr><td style="font-weight: bold; color: blue">ENCRYPTION</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/vigenere/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" 
                                   pattern="[a-zA-Z\s]+" title="Chỉ được nhập chữ cái tiếng Anh không dấu và khoảng trắng" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (Chuỗi chữ cái viết liền):</label>
                            <input type="text" class="form-control" name="inputKeyPlain" placeholder="Input Vigenere Key (e.g., SECRET)" 
                                   pattern="[a-zA-Z]+" title="Khóa Vigenere bắt buộc phải là chữ cái viết liền, không chứa số hay khoảng trắng" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>
            
            <tr><td style="font-weight: bold; color: blue">DECRYPTION</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/vigenere/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" 
                                   pattern="[a-zA-Z\s]+" title="Chỉ được nhập chữ cái tiếng Anh không dấu và khoảng trắng" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (Chuỗi chữ cái viết liền):</label>
                            <input type="text" class="form-control" name="inputKeyCipher" placeholder="Input Vigenere Key" 
                                   pattern="[a-zA-Z]+" title="Khóa Vigenere bắt buộc phải là chữ cái viết liền, không chứa số hay khoảng trắng" required/>
                        </div>
                        <button type="submit" class="btn btn-success">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
