<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUTECH | Vigenere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="{{ url_for('static', filename='gundam.js') }}"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="/"><img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png" alt="HUTECH Logo" class="h-16 bg-white p-2 rounded-lg shadow-sm hover:opacity-90 transition"></a>
        </div>
        <div class="text-right text-sm">
            <p class="font-semibold">PHẠM VĂN PHÚC</p>
            <p class="text-blue-200">MSSV: 2380601748</p>
        </div>
    </header>

    <main class="flex-grow p-6 md:p-10 max-w-3xl mx-auto w-full">
        <div class="mb-8 flex justify-between items-center border-b pb-4">
            <h2 class="text-2xl font-bold text-gray-800">VIGENERE CIPHER</h2>
            <a href="/" class="text-blue-600 underline text-sm">Quay lại</a>
        </div>

        <div class="flex w-full mb-8">
            <button type="button" id="btn-enc" onclick="switchMode('enc')" class="w-1/2 py-3 bg-blue-100 text-blue-800 font-bold border-b-2 border-blue-600">MÃ HÓA</button>
            <button type="button" id="btn-dec" onclick="switchMode('dec')" class="w-1/2 py-3 bg-white text-gray-500 font-bold border-b-2 border-transparent">GIẢI MÃ</button>
        </div>

        <section id="sec-enc" class="block">
            <form method="POST" action="/encrypt_vigenere" class="space-y-6" onsubmit="return validateVigenere(event, this)">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Bản rõ (Plaintext):</label>
                    <input type="text" name="inputPlainText" class="w-full p-3 border border-gray-300 rounded uppercase" required autofocus autocomplete="off" />
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Từ khóa (Keyword - Chỉ chữ cái):</label>
                    <input type="text" name="inputKeyPlain" class="w-full p-3 border border-gray-300 rounded uppercase" required autocomplete="off" />
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded">THỰC HIỆN MÃ HÓA</button>
            </form>
        </section>

        <section id="sec-dec" class="hidden">
            <form method="POST" action="/decrypt_vigenere" class="space-y-6" onsubmit="return validateVigenere(event, this)">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Bản mã (Ciphertext):</label>
                    <input type="text" name="inputCipherText" class="w-full p-3 border border-gray-300 rounded uppercase" required autocomplete="off" />
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Từ khóa (Keyword - Chỉ chữ cái):</label>
                    <input type="text" name="inputKeyCipher" class="w-full p-3 border border-gray-300 rounded uppercase" required autocomplete="off" />
                </div>
                <button type="submit" class="w-full py-3 bg-red-600 text-white font-bold rounded">THỰC HIỆN GIẢI MÃ</button>
            </form>
        </section>
    </main>

    <script>
        function switchMode(mode) {
            const encSec = document.getElementById('sec-enc');
            const decSec = document.getElementById('sec-dec');
            const btnEnc = document.getElementById('btn-enc');
            const btnDec = document.getElementById('btn-dec');

            if(mode === 'enc') {
                encSec.style.display = 'block'; decSec.style.display = 'none';
                btnEnc.className = "w-1/2 py-3 bg-blue-100 text-blue-800 font-bold border-b-2 border-blue-600";
                btnDec.className = "w-1/2 py-3 bg-white text-gray-500 font-bold border-b-2 border-transparent";
            } else {
                encSec.style.display = 'none'; decSec.style.display = 'block';
                btnEnc.className = "w-1/2 py-3 bg-white text-gray-500 font-bold border-b-2 border-transparent";
                btnDec.className = "w-1/2 py-3 bg-red-100 text-red-800 font-bold border-b-2 border-red-600";
            }
        }

        function validateVigenere(event, form) {
            const textInputs = form.querySelectorAll('input[type="text"]');
            const textInput = textInputs[0].value.trim();
            const keyInput = textInputs[1].value.trim();

            const alphaRegex = /^[A-Za-z]+$/;

            if (!textInput) {
                alert("LỖI: Văn bản không được để trống!");
                event.preventDefault();
                return false;
            }

            if (!keyInput || !alphaRegex.test(keyInput)) {
                alert("LỖI: Từ khóa chỉ được chứa các chữ cái (không có khoảng trắng, số hay ký tự đặc biệt)!");
                event.preventDefault();
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
