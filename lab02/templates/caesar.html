<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher - NERV Module</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Bảng màu NERV */
        :root {
            --bg-black: #050505;
            --panel-dark: #121212;
            --eva-purple: #6f2282; /* Màu đặc trưng Caesar/EVA-01 */
            --eva-green: #32cd32;
            --nerv-orange: #ff8c00;
            --text-main: #e0e0e0;
        }

        body { 
            background-color: var(--bg-black);
            background-image: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)), url('https://www.transparenttextures.com/patterns/hexellence.png');
            font-family: 'Chakra Petch', sans-serif;
            color: var(--text-main);
            padding-top: 50px;
        }

        /* Phong cách bảng điều khiển NERV */
        .container {
            background: var(--panel-dark);
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(111, 34, 130, 0.3); /* Phát sáng tím EVA-01 */
            border-radius: 5px;
            padding: 30px;
            max-width: 800px;
            position: relative;
        }

        /* Dải cảnh báo phía trên */
        .container::before {
            content: 'MAGI SYSTEM - SECURITY PROTOCOL ACTIVE';
            position: absolute; top: 0; left: 0; width: 100%;
            background: var(--eva-purple); color: white;
            font-size: 0.8rem; font-weight: bold; padding: 2px 15px;
        }

        /* Tùy chỉnh bảng */
        .table { color: var(--text-main); margin-top: 20px; }
        .table td { border-top: none; padding-bottom: 20px; }
        
        .main-title {
            color: var(--nerv-orange);
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
            letter-spacing: 3px;
        }

        .section-title {
            color: var(--eva-green) !important;
            border-bottom: 1px solid var(--eva-purple);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Tùy chỉnh Input field */
        .form-label { color: var(--text-main); font-weight: 600; text-transform: uppercase; font-size: 0.9rem;}
        .form-control {
            background: #0a0a0a;
            border: 1px solid #444;
            color: white;
            border-radius: 0;
        }
        .form-control:focus {
            background: #151515;
            border-color: var(--eva-green);
            color: white;
            box-shadow: 0 0 8px rgba(50, 205, 50, 0.4);
        }

        /* Tùy chỉnh nút bấm */
        .btn {
            border-radius: 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid transparent;
            transition: all 0.3s;
        }
        .btn-primary { 
            background: var(--eva-purple); 
            border-color: var(--eva-green); 
        }
        .btn-success { 
            background: #1e7e34; 
            border-color: #fff; 
        }
        .btn:hover { 
            filter: brightness(1.2); 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); 
        }

        /* Nút quay lại */
        .back-link {
            display: inline-block;
            color: var(--nerv-orange);
            margin-bottom: 20px;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { color: white; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><< RETURN TO MAIN MENU</a>

        <table class="table">
            <tr><td style="text-align: center; font-weight: bold; font-size: 25px;" class="main-title">CAESAR CIPHER MODULE</td></tr>
            
            <tr><td style="font-weight: bold;" class="section-title">ENCRYPTION PROTOCOL</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" 
                                   pattern="[a-zA-Z\s]+" title="Chỉ được nhập chữ cái tiếng Anh không dấu và khoảng trắng" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (1 - 25):</label>
                            <input type="number" class="form-control" name="inputKeyPlain" placeholder="Input Key (1-25)" 
                                   step="1" min="1" max="25" title="Khóa phải là số nguyên trong khoảng từ 1 đến 25" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Execute Encrypt</button>
                    </form>
                </td>
            </tr>
            
            <tr><td style="font-weight: bold; margin-top: 30px;" class="section-title">DECRYPTION PROTOCOL</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" 
                                   pattern="[a-zA-Z\s]+" title="Chỉ được nhập chữ cái tiếng Anh không dấu và khoảng trắng" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (1 - 25):</label>
                            <input type="number" class="form-control" name="inputKeyCipher" placeholder="Input Key (1-25)" 
                                   step="1" min="1" max="25" title="Khóa phải là số nguyên trong khoảng từ 1 đến 25" required/>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Execute Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
