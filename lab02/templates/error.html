<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gundam Security Alert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='gundam.css') }}">
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
    <div class="scan-line"></div>

    <div class="w-full max-w-2xl gundam-shell p-1 relative">
        <div class="gundam-bar text-black px-4 py-2 flex justify-between items-center mb-6">
            <span class="font-bold tracking-widest">SYSTEM: INPUT_REJECTED</span>
            <span class="text-xs">[ DEFENSE MATRIX ]</span>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            <div class="border-b border-slate-700 pb-4">
                <h1 class="text-3xl font-bold text-white tracking-[0.35em]">INVALID SEQUENCE</h1>
                <p class="text-sm text-slate-400 mt-2">{{ error_message }}</p>
            </div>

            <div class="gundam-panel p-4 space-y-3 text-sm text-slate-300">
                <p><span class="text-gundam-blue">REASON</span>: {{ error_message }}</p>
                <p><span class="text-gundam-yellow">STATUS</span>: Input validation blocked the operation before execution.</p>
                <p><span class="text-gundam-red">ACTION</span>: Adjust the form to match the cipher requirements and try again.</p>
            </div>
        </div>

        <div class="px-6 py-4 flex justify-between text-xs text-slate-500">
            <a href="/" class="hover:text-white cursor-pointer">&lt; RETURN_TO_ROOT</a>
            <span>STATUS: LOCKED</span>
        </div>
    </div>
</body>
</html>
